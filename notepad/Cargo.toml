[package]
name = "patrone-notepad"
version = "0.2.0"
edition = "2024"
# Ubuntu 26.04's rustc, which builds the package
rust-version = "1.93"
description = "Notepad: a plain text editor with tabs, for PatroneOS"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# Ubuntu 26.04 ships GNOME 50 (GTK 4.22, GLib 2.88).
gtk = { package = "gtk4", version = "0.11", features = ["gnome_50"] }
# Printing: drawing the text's lines on the printer's pages
pangocairo = "0.22"
# Pango 1.56's add_font_file: PatroneOS's fonts loaded from the app's own
# folder where the system doesn't have them (the Windows build)
pango = { version = "0.22", features = ["v1_56"] }
# Markdown: where its headings, emphasis, links, lists and so on are in the
# text, for the formatted view, and HTML for Export as HTML
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[profile.release]
lto = true
